[package]
name = "ncode"
version = "0.1.0"
edition = "2024"
description = "Native (GPUI) proof-of-concept port of T3 Code"
license = "MIT"
readme = "README.md"

[dependencies]
gpui-kit = { version = "0.9.1", features = ["gpui-fast"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
dirs = "6"
flume = "0.11"
log = "0.4"
env_logger = "0.11"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
